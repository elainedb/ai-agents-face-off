name: ytdash_flutter_codex
description: A Flutter YouTube dashboard app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  bloc_concurrency: ^0.3.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_performance: ^0.10.1+9
  flutter_bloc: ^9.1.1
  flutter_map: ^8.1.1
  flutter_map_cancellable_tile_provider: ^3.1.0
  geocoding: ^3.0.0
  get_it: ^8.0.3
  google_sign_in: ^6.3.0
  http: ^1.4.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  path: ^1.9.1
  sqflite: ^2.4.2
  url_launcher: ^6.3.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
