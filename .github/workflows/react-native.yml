name: React Native
on:
  push:
    branches: [main]
    paths: ['**/rn/**', '.github/workflows/react-native.yml']
  pull_request:
    paths: ['**/rn/**', '.github/workflows/react-native.yml']
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 2025-login-feed/rn/claude
          - 2025-login-feed/rn/gemini
          - 2025-login-feed/rn/junie
          - 2026-ytdash/rn/claude
          - 2026-ytdash/rn/gemini
          - 2026-ytdash/rn/codex
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Prepare placeholder config
        run: ${{ github.workspace }}/.github/scripts/prepare-project.sh .
      - run: npm ci --legacy-peer-deps
      - name: Unit tests
        run: npm run test:ci
      - name: Lint
        run: npm run lint
