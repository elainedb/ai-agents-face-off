name: Android
on:
  push:
    branches: [main]
    paths: ['**/android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['**/android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 2025-login-feed/android/claude
          - 2025-login-feed/android/gemini
          - 2025-login-feed/android/junie
          - 2026-ytdash/android/claude
          - 2026-ytdash/android/gemini
          - 2026-ytdash/android/codex
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
