name: Flutter
on:
  push:
    branches: [main]
    paths: ['**/flutter/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['**/flutter/**', '.github/workflows/flutter.yml']
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: 2025-login-feed/flutter/claude, flutter: 3.35.x }
          - { project: 2025-login-feed/flutter/gemini, flutter: 3.35.x }
          - { project: 2025-login-feed/flutter/junie,  flutter: 3.35.x }
          - { project: 2026-ytdash/flutter/claude,     flutter: 3.47.x }
          - { project: 2026-ytdash/flutter/gemini,     flutter: 3.47.x }
          - { project: 2026-ytdash/flutter/codex,      flutter: 3.47.x }
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Prepare placeholder config
        run: ${{ github.workspace }}/.github/scripts/prepare-project.sh .
      - run: flutter pub get
      - name: Unit tests
        run: flutter test
